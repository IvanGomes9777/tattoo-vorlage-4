<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Libre+Franklin:wght@300;400;600&family=Space+Mono&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;background:#0d0d0b;color:#F4EEDF;font-family:'Libre Franklin',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
.sec{padding:clamp(3rem,8vw,6rem) 0}
.h{max-width:1100px;margin:0 auto clamp(1.5rem,4vw,2.5rem);padding:0 1.5rem;text-align:center}
.kick{font-family:'Space Mono';font-size:.72rem;letter-spacing:.3em;text-transform:uppercase;color:#E0A53C}
.h h2{font-family:'Alfa Slab One',serif;font-weight:400;font-size:clamp(1.6rem,1rem+2.6vw,2.6rem);color:#F4EEDF;margin:.5rem 0 0}
.h p{color:#B6AD95;font-weight:300;max-width:52ch;margin:.8rem auto 0}
.rows{display:flex;flex-direction:column;gap:12px}
.row{overflow:hidden}
.track{display:flex;gap:12px;width:max-content;animation:ml 28s linear infinite}
.row.r2 .track{animation:mr 34s linear infinite}
.row:hover .track{animation-play-state:paused}
@keyframes ml{to{transform:translateX(-50%)}}@keyframes mr{from{transform:translateX(-50%)}to{transform:translateX(0)}}
.it{position:relative;height:clamp(150px,26vw,210px);aspect-ratio:3/4;flex:none;border:0;padding:0;border-radius:10px;overflow:hidden;cursor:pointer;transition:transform .3s;background:none}
.it img{height:100%;width:100%;object-fit:cover;filter:grayscale(1);transition:.5s}
.it:hover{transform:scale(1.06);z-index:5}
.it:hover img{filter:grayscale(0)}
.cap{position:absolute;left:0;right:0;bottom:0;padding:.5rem .7rem;background:linear-gradient(transparent,rgba(13,13,11,.9));font-family:'Space Mono';font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;color:#E0A53C;text-align:left;transform:translateY(100%);transition:.3s}
.it:hover .cap{transform:translateY(0)}
.lb{position:fixed;inset:0;z-index:100;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(13,13,11,.95);backdrop-filter:blur(4px);padding:1rem}
.lb.on{display:flex;animation:f .3s ease}
@keyframes f{from{opacity:0}to{opacity:1}}
.lb img{max-height:85vh;max-width:92vw;border-radius:10px;object-fit:contain;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.lb .x{position:absolute;top:1rem;right:1rem;width:44px;height:44px;border-radius:999px;border:1px solid #E0A53C;background:none;color:#E0A53C;font-size:1.2rem;cursor:pointer}
.lb .x:hover{background:#E0A53C;color:#141414}
.lb .meta{margin-top:1rem;text-align:center}
.lb .meta .s{font-family:'Space Mono';font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:#E0A53C}
.lb .btn{display:inline-block;margin-top:.8rem;border:1px solid #E0A53C;background:#E0A53C;color:#141414;padding:.6rem 1.4rem;font-weight:600;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;border-radius:2px;text-decoration:none}
</style></head><body>
<section class="sec"><div class="h"><span class="kick">Ausgewählte Arbeiten</span><h2>Unsere Werke</h2>

<div class="row r2"><div class="track"><button class="it" data-full="https://images.unsplash.com/photo-1612459284970-e8f027596582?auto=format&q=85" data-s="Dotwork"><img src="https://images.unsplash.com/photo-1612459284970-e8f027596582?auto=format&fit=crop&w=500&q=60" alt="Dotwork" loading="lazy"><span class="cap">Dotwork · Custom</span></button><button class="it" data-full="https://images.unsplash.com/photo-1607779097040-26e80aa78e66?auto=format&q=85" data-s="Custom"><img src="https://images.unsplash.com/photo-1607779097040-26e80aa78e66?auto=format&fit=crop&w=500&q=60" alt="Custom" loading="lazy"><span class="cap">Custom · Custom</span></button><button class="it" data-full="https://images.unsplash.com/photo-1543059080-f9b1272213d5?auto=format&q=85" data-s="Lettering"><img src="https://images.unsplash.com/photo-1543059080-f9b1272213d5?auto=format&fit=crop&w=500&q=60" alt="Lettering" loading="lazy"><span class="cap">Lettering · Custom</span></button><button class="it" data-full="https://images.unsplash.com/photo-1598371839696-5c5bb00bdc28?auto=format&q=85" data-s="Geometric"><img src="https://images.unsplash.com/photo-1598371839696-5c5bb00bdc28?auto=format&fit=crop&w=500&q=60" alt="Geometric" loading="lazy"><span class="cap">Geometric · Custom</span></button><button class="it" data-full="https://images.unsplash.com/photo-1542856391-010fb87dcfed?auto=format&q=85" data-s="Realism"><img src="https://images.unsplash.com/photo-1542856391-010fb87dcfed?auto=format&fit=crop&w=500&q=60" alt="Realism" loading="lazy"><span class="cap">Realism · Custom</span></button><button class="it" data-full="https://images.unsplash.com/photo-1565058379802-bbe93b2f703a?auto=format&q=85" data-s="Fine-Line"><img src="https://images.unsplash.com/photo-1565058379802-bbe93b2f703a?auto=format&fit=crop&w=500&q=60" alt="Fine-Line" loading="lazy"><span class="cap">Fine-Line · Custom</span></button><button class="it" data-full="https://images.unsplash.com/photo-1611501275019-9b5cda994e8d?auto=format&q <div class="lb" id="lb"><button class="x" id="x">✕</button><img id="lbimg" src="" alt="Werk"><div class="meta"><div class="s" id="lbs"></div><a class="btn" href="#" id="lbbtn">Ähnliches Tattoo anfragen</a></div></div>
<script>
const lb=document.getElementById('lb'),lbimg=document.getElementById('lbimg'),lbs=document.getElementById('lbs');
function open(f,s){lbimg.src=f;lbs.textContent=s+' · Custom';lb.classList.add('on');document.body.style.overflow='hidden';}
function close(){lb.classList.remove('on');document.body.style.overflow='';}
document.querySelectorAll('.it').forEach(b=>b.addEventListener('click',()=>open(b.dataset.full,b.dataset.s)));
document.getElementById('x').onclick=close;document.getElementById('lbbtn').onclick=close;
lb.addEventListener('click',e=>{if(e.target===lb)close()});
lbimg.addEventListener('click',e=>e.stopPropagation());
document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
</script>
</body></html>
